version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: awms
      POSTGRES_PASSWORD: awms_password
      POSTGRES_DB: awms
    ports:
      - "5432:5432"
    volumes:
      - awms_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  awms_pg_data:
