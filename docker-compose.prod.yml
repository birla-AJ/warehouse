version: "3.9"

# Production stack for AWMS. Copy backend/.env.example -> backend/.env and
# fill in real secrets before running this. Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend npm run prisma:deploy
#   docker compose -f docker-compose.prod.yml exec backend npm run prisma:seed   # first run only

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-awms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a .env file at the repo root}
      POSTGRES_DB: ${POSTGRES_DB:-awms}
    volumes:
      - awms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [awms_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - awms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [awms_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-awms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-awms}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [awms_net]

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [awms_net]

networks:
  awms_net:

volumes:
  awms_pg_data:
  awms_redis_data:
